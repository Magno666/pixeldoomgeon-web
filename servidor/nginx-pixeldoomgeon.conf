# PIXELDOOMGEON — subdominio propio, aislado del resto del servidor.
#
# Mismo patron que lagpfutbol: server_name distinto = bloque distinto.
# nginx enruta por cabecera Host, asi que este archivo NO puede afectar a
# jaliscomundial.com, ni a licitaciones, ni a ningun otro sitio. No hace
# proxy a nada, no abre puertos y no comparte docroot.
#
# Diferencia deliberada con los demas: este SI se quiere indexable. Es la
# pagina publica del juego; ocultarla de los buscadores no tendria sentido.

server {
    server_name pixeldoomgeon.jaliscomundial.com;

    root /var/www/pixeldoomgeon;
    index index.html;

    # El juego son 188 archivos y casi todos se piden en la misma rafaga.
    # Guardar sus descriptores y su metadata en memoria evita repetir el
    # stat() de cada uno en cada peticion. 400 entradas porque los archivos
    # son 188 y sobra sitio.
    open_file_cache          max=400 inactive=120s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors   off;

    # juego.js.gz lo deja hecho desplegar.sh. Sin esto nginx comprime los
    # 6.25 MB del bundle EN CADA carga -- hoy llevaba 65, o sea 400 MB de
    # compresion para el mismo resultado. Ademas gzip -9 deja 880 KB donde
    # el -6 de nginx deja 907.
    gzip_static on;

    access_log /var/log/nginx/pixeldoomgeon.access.log;
    error_log  /var/log/nginx/pixeldoomgeon.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Las capturas no cambian; el HTML si, mientras el proyecto avanza.
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }
    # HTML, JS y los niveles: revalidar SIEMPRE.
    #
    # Antes esto era `location = /index.html`, que en nginx significa la
    # raiz EXACTA y no cubria /demo/index.html ni el JS. Sin cabecera,
    # Chrome cacheaba por heuristica y seguia enseñando una version vieja
    # despues de desplegar -- un arreglo publicado no llegaba al telefono.
    # El bundle es la excepcion a la regla de abajo. Su <script src> lleva
    # ?v=<sello>, asi que la URL cambia sola en cuanto el contenido cambia
    # -- y desplegar.sh solo conserva el sello cuando el archivo es
    # identico byte a byte. Cachearlo de verdad ahorra 906 KB a cada
    # persona que vuelve; hoy iban 20 MB de re-descargas para nada.
    #
    # El index.html de al lado sigue en no-cache a proposito: es quien
    # lleva el sello, y si se cacheara el nuevo no se veria nunca. Ese fue
    # el fallo que dejo a Leonel probando contra un juego.js viejo.
    location = /juego/juego.js {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(html|js|mjs|json)$ {
        add_header Cache-Control "no-cache";
    }
    location ~ /$ {
        add_header Cache-Control "no-cache";
    }

    # Contador y encuesta. Servicio propio en 127.0.0.1:8160, biblioteca
    # estandar de Python, sin dependencias. Solo escucha en local: la unica
    # forma de llegar es por aqui.
    location /api/ {
        proxy_pass http://127.0.0.1:8160;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
        client_max_body_size 4k;
        add_header Cache-Control "no-store" always;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pixeldoomgeon.jaliscomundial.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pixeldoomgeon.jaliscomundial.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = pixeldoomgeon.jaliscomundial.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name pixeldoomgeon.jaliscomundial.com;
    return 404; # managed by Certbot


}